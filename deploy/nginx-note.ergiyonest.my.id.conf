# Tempel / sesuaikan di aaPanel → Website → note.ergiyonest.my.id → Config
# root WAJIB .../public  (bukan folder proyek yang berisi app/, vendor/, data/)
#
# Socket PHP: cek di panel (php-cgi-82.sock, php-fpm-82.sock, dll.)

server {
    listen 80;
    listen 443 ssl http2;
    server_name note.ergiyonest.my.id;
    root /www/wwwroot/note.ergiyonest.my.id/public;
    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi.conf;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_read_timeout 120s;
        fastcgi_buffering off;
    }

    location ~ ^/(data|app|vendor|docs|cron)/ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
